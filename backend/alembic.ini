[alembic]
script_location = alembic
prepend_sys_path = .

# The actual target DB is resolved at runtime from the DATABASE_URL env var
# (see alembic/env.py). This fallback only matters for offline/--autogenerate
# runs that do not export DATABASE_URL.
sqlalchemy.url = driver://nouser@nohost/nodb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S